<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9b86b;--ink:#3a2615;--card:#fff4dc;--yel:#f2b705;--line:#3a2615;--grn:#4f9d3a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2f2016;--ink:#f6e7cc;--card:#5a4331;--line:#f6e7cc}}
:root[data-theme="dark"]{--bg:#2f2016;--ink:#f6e7cc;--card:#5a4331;--line:#f6e7cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{max-width:760px;margin:0 auto;padding:8px 10px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:6px 12px;margin-bottom:8px}
#earth{font-size:34px;line-height:1;filter:grayscale(1) sepia(.6);transition:filter .6s}
.hud .t{flex:1;font-size:14px;font-weight:700}
.bar{height:12px;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin-top:3px;background:rgba(0,0,0,.15)}
.bar i{display:block;height:100%;width:0;background:var(--grn);transition:width .5s}
.wrap{border:3px solid var(--line);border-radius:18px;overflow:hidden;aspect-ratio:8/5;background:#8fd0e8;flex:none;width:min(100%,calc((100dvh - 250px)*1.6));margin:0 auto}
canvas{display:block;width:100%;height:100%}
.btn{font:inherit;font-weight:700;font-size:19px;background:var(--yel);color:#3a2615;border:3px solid #3a2615;border-radius:14px;padding:10px 24px;box-shadow:0 4px 0 #3a2615;cursor:pointer;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2615}
.btn:focus-visible,.ctl:focus-visible,.opt:focus-visible,.bin:focus-visible{outline:4px solid #1b6ef3;outline-offset:2px}
.ctls{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding:14px 4px 6px;gap:10px}
.grp{display:flex;gap:10px}.grp.r{display:grid;grid-template-columns:70px 84px;grid-template-areas:'n .' 'f j';gap:8px;align-items:end;justify-items:center}#bn{grid-area:n;width:50px!important;height:50px!important;font-size:22px!important}#bj{grid-area:j}#bf{grid-area:f;width:70px;height:70px}
.ctl{font:inherit;font-weight:700;font-size:30px;width:72px;height:72px;border-radius:50%;border:3px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);touch-action:none}
.ctl.on{transform:translateY(4px);box-shadow:0 1px 0 var(--line);background:var(--yel);color:#3a2615}
.ctl.fire{background:#3b82c4;color:#fff;font-size:30px}#bj{width:84px;height:84px;font-size:34px}
.hint{text-align:center;font-size:13px;margin:10px 0 0;opacity:.8}@media (pointer:coarse){.hint{display:none}}
@media (orientation:landscape) and (max-height:520px){.hud{padding:3px 10px;margin-bottom:4px}#earth{font-size:24px}#app{padding:4px 8px}.wrap{width:min(100%,calc((100dvh - 52px)*1.6))}.ctls{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none;margin:0;z-index:5}.ctls .ctl{pointer-events:auto;opacity:.85;width:62px;height:62px;font-size:24px}#bj{width:70px;height:70px}#bf{width:62px;height:62px}.grp.r{grid-template-columns:62px 70px}}
#pn{position:fixed;inset:0;background:rgba(40,25,12,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
#pn.hide{display:none}
#pb{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:22px;padding:18px;width:100%;max-width:440px;text-align:center}
#pb h1{font-size:30px;line-height:1.05;margin:4px 0 8px}
#pb h2{font-size:22px;margin:4px 0 6px}
#pb p{font-size:17px;line-height:1.4;margin:6px 0}
.big{font-size:70px;line-height:1.1}
.tag{display:inline-block;font-size:14px;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:2px 10px;margin-bottom:4px}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bin{font:inherit;font-weight:700;font-size:14px;color:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 2px;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.bin b{display:block;font-size:24px}
.msg{min-height:44px;font-weight:700;font-size:16px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:9px;cursor:pointer}
.opt.ok{background:#b9e3a2;color:#1f3d12}
.opt.no{background:#f4b3a8;color:#4a140c}
.final{font-size:24px;font-weight:700;line-height:1.25;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <div class="hud"><span id="earth">🌍</span><div class="t"><span id="lvl">Terra cheia de lixo</span><div class="bar"><i id="fill"></i></div></div></div>
 <div class="wrap"><canvas id="c" aria-label="Jogo de plataforma"></canvas></div>
 <div class="ctls">
  <div class="grp"><button class="ctl" id="bl" aria-label="Esquerda">◀</button><button class="ctl" id="br" aria-label="Direita">▶</button></div>
  <div class="grp r"><button class="ctl" id="bj" aria-label="Pular">⬆</button><button class="ctl fire" id="bf" aria-label="Atirar">♻️</button></div>
 </div>
 <p class="hint">Teclado: setas ou A/D e espaço para pular. Z ou X: dash, agarrar e arremessar. E: conversar. Pule em cima dos monstros para derrotá‑los!</p>
</div>
<div id="pn"><div id="pb"></div></div>
<script>
var W=480,H=300,G=1100;
var c=document.getElementById('c'),x=c.getContext('2d'),scale=1;
function resize(){var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;scale=c.width/W;}
addEventListener('resize',resize);resize();
function qs(i){return document.getElementById(i);}
function shuffle(a){return a.sort(function(){return Math.random()-.5});}

var TYPE={'📰':'papel','📦':'papel','🧴':'plastico','🥤':'plastico','🍾':'vidro','🫙':'vidro','🥫':'metal','🔩':'metal','🍌':'organico','🍎':'organico'};
var BINS={papel:['📘','Papel','#3b82c4'],plastico:['🧴','Plástico','#d6453d'],vidro:['🍾','Vidro','#3f9b5a'],metal:['🥫','Metal','#c49000'],organico:['🍂','Orgânico','#8a5a33']};
var SC=[
 {e:'🚿',t:'Você está escovando os dentes. E a torneira?',o:['Deixo aberta o tempo todo','Fecho e só abro para enxaguar','Abro só no final'],c:1,w:'Fechar a torneira economiza litros de água.'},
 {e:'🍾',t:'Sobrou uma garrafa de vidro vazia. O que fazer?',o:['Jogar fora','Usar como vaso ou porta‑lápis','Quebrar e deixar no chão'],c:1,w:'Reutilizar evita que vire lixo antes da hora.'},
 {e:'🛒',t:'Hora das compras no mercado.',o:['Pegar sacolas plásticas novas','Levar minha sacola de pano','Uma sacola para cada item'],c:1,w:'Uma sacola reutilizável substitui centenas descartáveis.'},
 {e:'🍲',t:'Sobrou comida do almoço.',o:['Jogar no lixo comum','Guardar na geladeira ou compostar','Deixar estragar na mesa'],c:1,w:'Guardar ou compostar reduz o desperdício.'}];
var LV=[
 {name:'Fase 1: o Lixão',L:1900,cp:[680],st:1650,gate:1820,q:[0],flag:1865,
  sol:[[0,260,600,40],[680,260,620,40],[1380,260,520,40],[200,190,90,12],[340,150,90,12],[480,190,80,12],[760,200,110,12],[900,160,100,12],[1050,200,100,12],[1200,160,90,12],[1460,200,100,12],[1600,160,100,12]],
  en:[['🥤',300,260,260,420,1,40],['🍌',520,260,500,590,1,50],['🥫',780,200,760,860,1,45],['🍌',920,160,900,990,1,40],['🗑️',1000,260,900,1200,2,40],['🥤',1250,260,1100,1290,1,50],['🗑️',1480,260,1400,1560,2,40]],
  it:[[240,190,'📰'],[380,150,'🍾'],[510,190,'🥫'],[800,200,'🧴'],[940,160,'🍌'],[1240,160,'📦']]},
 {name:'Fase 2: a Fábrica',L:2100,cp:[590,1240],st:1900,gate:2020,q:[2],flag:2065,
  sol:[[0,260,500,40],[590,260,560,40],[1240,260,860,40],[180,200,90,12],[320,160,90,12],[460,200,70,12],[620,190,100,12],[780,150,100,12],[920,190,90,12],[1060,150,90,12],[1320,200,100,12],[1450,160,100,12],[1600,200,100,12]],
  en:[['🛢️',260,260,200,450,3,35],['🥤',340,160,320,400,1,50],['🥫',640,190,620,710,1,45],['🗑️',720,260,640,900,2,45],['🍌',800,150,780,870,1,50],['🛢️',1000,260,950,1140,3,35],['🥤',1350,260,1260,1500,1,60],['🗑️',1480,160,1450,1540,2,45],['🛢️',1720,260,1620,1850,3,40]],
  it:[[210,200,'🧴'],[350,160,'📰'],[650,190,'🍎'],[810,150,'🫙'],[1090,150,'🔩'],[1480,160,'🥤']]},
 {name:'Fase 3: a Montanha de Lixo',L:2400,cp:[790],st:1450,boss:1900,
  sol:[[0,260,700,40],[790,260,1610,40],[150,190,90,12],[300,150,90,12],[450,190,90,12],[640,190,100,12],[870,200,100,12],[1010,160,100,12],[1150,200,100,12],[1300,160,100,12]],
  en:[['🥤',250,260,200,420,1,50],['🛢️',500,260,420,650,3,40],['🗑️',900,260,820,1000,2,45],['🍌',1030,160,1010,1100,1,50],['🛢️',1180,260,1100,1360,3,40],['🥫',1320,160,1300,1390,1,50]],
  it:[[180,190,'📦'],[330,150,'🍾'],[670,190,'🥫'],[900,200,'🍎'],[1180,200,'🧴'],[1330,160,'📰']]}];
var INTRO=[
 ['Início','🤖','Robô Recicla','Os humanos consumiram demais e a Terra ficou coberta de lixo. Monstros feitos de sujeira tomaram tudo. Você é um robô, como o WALL‑E, e tem a missão de recuperar o planeta. Pule em cima dos monstros (se pisar numa lixeira, ela fecha como um casco: chute‑a para derrubar os outros!), recolha recicláveis e faça escolhas conscientes.','Começar a missão'],
 ['Meio','🏭','A Fábrica abandonada','Você abriu caminho pelo lixão. Agora os monstros estão mais fortes e o ar é pesado. Continue pulando nos monstros e pegando baterias.','Entrar na fábrica'],
 ['Meio','⛰️','A Montanha de Lixo','Lá no alto vive o Monstro da Poluição, também chamado de Monstro‑Montanha, o chefe de todos. Derrote‑o e a terra estará livre para plantar de novo.','Subir a montanha']];

var cur=0,lv,p,en,bul,eb,fx,items,bag,sprouts,boss,patches,gate,station,flag,lives,cam,cp,SOL,state='panel',tm=0,shootCd=0,bossT=0,prog=0,progStart=0;
var K={l:0,r:0,j:0,f:0},jumpLatch=0;

function setProg(v){prog=Math.min(100,v);qs('fill').style.width=prog+'%';qs('earth').style.filter='grayscale('+(1-prog/100)+') sepia('+(.6*(1-prog/100))+')';}
function panel(h){K.l=K.r=K.j=K.f=0;[].forEach.call(document.querySelectorAll('.ctl'),function(b){b.classList.remove('on')});state='panel';qs('pb').innerHTML=h;qs('pn').classList.remove('hide');}
function closePanel(){qs('pn').classList.add('hide');state='play';}

function loadLevel(i){
 cur=i;lv=LV[i];setProg(progStart);qs('lvl').textContent=lv.name;
 SOL=lv.sol.map(function(a){return{x:a[0],y:a[1],w:a[2],h:a[3]};});
 gate=lv.gate?{x:lv.gate,open:false,asking:false,s:{x:lv.gate,y:180,w:14,h:80}}:null;if(gate)SOL.push(gate.s);
 station=null&&lv.st?{x:lv.st,done:false}:null;flag=lv.flag||0;
 en=lv.en.map(function(a){return{e:a[0],x:a[1],y:a[2]-28,w:26,h:28,min:a[3],max:a[4],hp:a[5],mhp:a[5],vx:a[6],hit:0};});
 items=lv.it.map(function(a){return{x:a[0],y:a[1]-24,w:20,h:20,e:'🔋',got:0};});
 boss=lv.boss?{x:lv.boss,y:196,w:64,h:64,hp:9,mhp:9,vx:38,min:lv.boss-150,max:lv.boss+150,hit:0}:{hp:0,mhp:1,x:-999,y:0,w:0,h:0,vx:0,min:0,max:0,hit:0};
 patches=(lv.pl||[]).map(function(a){return{x:a,w:34,st:0,t:0};});
 bag=[];bul=[];eb=[];fx=[];sprouts=[];parts=[];dying=[];thr=[];lives=100;cam=0;cp=40;bossT=0;bAtk=null;bAtkCd=3;bAtkN=0;shk=0;
 p={x:40,y:200,w:22,h:28,vx:0,vy:0,g:false,face:1,inv:0};
}
function story(i){if(i===0){introScreen();return;}var s=INTRO[i];panel('<span class="tag">'+s[0]+'</span><div class="big">'+s[1]+'</div><h1>'+s[2]+'</h1><p>'+s[3]+'</p><button class="btn" id="go">'+s[4]+'</button>');
 qs('go').onclick=function(){loadLevel(i);closePanel();};}
function over(msg){panel('<div class="big">💥</div><h2>Os monstros venceram desta vez</h2><p>'+msg+'</p><button class="btn" id="go">Tentar a fase de novo</button>');qs('go').onclick=function(){loadLevel(cur);closePanel();};}

/* estação de reciclagem */
function openStation(){
 if(!bag.length){panel('<div class="big">♻️</div><h2>Estação de Reciclagem</h2><p>Você não trouxe nenhum reciclável. Na próxima, pegue os itens que flutuam pelo caminho.</p><button class="btn" id="go">Continuar</button>');qs('go').onclick=closePanel;return;}
 var q=shuffle(bag.slice());
 (function next(){
  if(!q.length){bag=[];panel('<div class="big">✅</div><h2>Tudo separado!</h2><p>O lixo virou material novo.</p><button class="btn" id="go">Continuar</button>');qs('go').onclick=closePanel;return;}
  var it=q[0],bins=Object.keys(BINS).map(function(k){var b=BINS[k];return '<button class="bin" data-k="'+k+'" style="background:'+b[2]+'"><b>'+b[0]+'</b>'+b[1]+'</button>';}).join('');
  panel('<h2>Estação de Reciclagem</h2><div class="big">'+it+'</div><div class="bins">'+bins+'</div><p class="msg" id="m">Em qual lixeira vai? Faltam '+q.length+'.</p>');
  [].forEach.call(document.querySelectorAll('.bin'),function(b){b.onclick=function(){
   if(b.dataset.k===TYPE[it]){q.shift();setProg(prog+2);qs('m').textContent='Isso! ♻️';setTimeout(next,300);}
   else{qs('m').textContent='Quase! Esse item vai na lixeira de '+BINS[TYPE[it]][1].toLowerCase()+'.';b.style.opacity=.35;}};});
 })();
}
/* portão com pergunta */
function openGate(){
 var list=lv.q.slice(),i=0;
 (function nx(){
  if(i>=list.length){gate.open=true;SOL.splice(SOL.indexOf(gate.s),1);panel('<div class="big">🔓</div><h2>Portão aberto!</h2><p>Boas escolhas abrem caminhos.</p><button class="btn" id="go">Seguir</button>');qs('go').onclick=closePanel;return;}
  var s=SC[list[i]];
  panel('<span class="tag">Escolha consciente</span><div class="big">'+s.e+'</div><p>'+s.t+'</p><div id="op"></div><p class="msg" id="m"></p>');
  s.o.forEach(function(t,k){var b=document.createElement('button');b.className='opt';b.textContent=t;
   b.onclick=function(){
    if(k===s.c){b.classList.add('ok');qs('m').textContent='Boa escolha! '+s.w;setProg(prog+8);
     [].forEach.call(document.querySelectorAll('.opt'),function(o){o.disabled=true});setTimeout(function(){i++;nx();},1700);}
    else{b.classList.add('no');b.disabled=true;qs('m').textContent='Pense de novo: qual gasta menos e desperdiça menos?';}};
   qs('op').appendChild(b);});
 })();
}
function nextLevel(){progStart=prog;panel('<div class="big">🏁</div><h2>Fase concluída!</h2><p>O planeta já está um pouco mais limpo.</p><button class="btn" id="go">Continuar</button>');qs('go').onclick=function(){story(cur+1);};}
function finaleOld(){setProg(100);panel('<div class="big">🌍🌳</div><h1>Terra verde de novo!</h1><div class="final">Assim como WALL‑E, podemos ser heróis do planeta! ♻️🌱</div><p>Pequenas atitudes, como separar o lixo, economizar água e reutilizar, fazem uma grande diferença.</p><button class="btn" id="go">Jogar de novo</button>');qs('go').onclick=function(){progStart=0;story(0);};}

/* controles */
function bind(id,k){var b=qs(id);
 function dn(e){e.preventDefault();K[k]=1;b.classList.add('on');if(k==='j')jumpLatch=1;if(k==='f')fLatch=1;}
 function up(e){e.preventDefault();K[k]=0;b.classList.remove('on');}
 b.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(function(n){b.addEventListener(n,up);});
 b.addEventListener('contextmenu',function(e){e.preventDefault()});}
bind('bl','l');bind('br','r');bind('bj','j');bind('bf','f');
var KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'j',w:'j',' ':'j',z:'f',x:'f',j:'f'};
addEventListener('keydown',function(e){var k=KM[e.key];if(k&&state==='play'){e.preventDefault();if(k==='j'&&!K.j)jumpLatch=1;if(k==='f'&&!K.f)fLatch=1;K[k]=1;}});
addEventListener('keyup',function(e){var k=KM[e.key];if(k)K[k]=0;});

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hurt(kx,d){if(p.inv>0)return;p.hold=null;p.dash=0;lives-=(d||15);p.inv=1.6;p.vy=-250;p.vx=kx*200;fx.push({x:p.x,y:p.y-10,t:.7,e:'💥'});if(lives<=0)over('Tente de novo, o planeta conta com você.');}
function respawn(){lives-=25;if(lives<=0){over('Você caiu no lixão. Cuidado com os buracos.');return;}p.x=cp;p.y=120;p.vx=p.vy=0;p.inv=1.6;}
function kill(e,isB){var cx=e.x+e.w/2,fy=e.y+e.h;dying.push({k:isB?'boss':e.e,x:cx,y:fy,t:isB?1.3:.45,T:isB?1.3:.45,sx:cx-8,sy:fy-4,e:e});spark(cx,fy-14,isB?'#8cff3a':'#ffd23a',isB?30:12);spark(cx,fy-14,'#ffffff',6);setProg(prog+(isB?10:2));if(!isB&&Math.random()<.35){lives=Math.min(100,lives+10);fx.push({x:cx,y:fy-30,t:.9,e:'💚'});}}

function update(dt){
 tm+=dt;
 var ax=K.r-K.l;p.vx=p.inv<1.3?ax*150:p.vx*.9;if(ax&&!(p.dash>0))p.face=ax;if(p.dash>0){p.vx=p.face*340;p.dash-=dt;if(p.vy>0)p.vy*=.5;}
 if(jumpLatch&&p.g){p.vy=-420;p.g=false;}jumpLatch=0;
 p.vy+=G*dt;if(p.vy>700)p.vy=700;
 p.x+=p.vx*dt;if(p.x<0)p.x=0;if(p.x>lv.L-p.w)p.x=lv.L-p.w;
 SOL.forEach(function(s){if(hit(p,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;}});
 p.y+=p.vy*dt;p.g=false;
 SOL.forEach(function(s){if(hit(p,s)){if(p.vy>0){p.y=s.y-p.h;p.g=true;}else if(p.vy<0)p.y=s.y+s.h;p.vy=0;}});
 if(p.g)lv.cp.forEach(function(t){if(p.x>t+20&&cp<t+20)cp=t+20;});
 if(p.y>H+40){respawn();return;}
 if(p.inv>0)p.inv-=dt;if(p.stomp>0)p.stomp-=dt;
 shootCd-=dt;
 if(fLatch){fLatch=0;dashAct();}holdTick(dt);if(0&&K.f&&shootCd<=0){shootCd=.26;bul.push({x:p.x+(p.face>0?p.w:-10),y:p.y+9,w:10,h:10,vx:p.face*420,life:.9});}
